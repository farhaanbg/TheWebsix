{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated – Dina Arobi Hike Mauritius</title>
    <!-- Google Fonts for Barlow Condensed, Inter, and DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Color Palette & Variables */
        :root {
            --background: #0B1710;
            --card: #132019;
            --primary: #3B9E52;
            --secondary: #1E2D22;
            --muted: #1A2A1E;
            --accent: #EBC535;
            --muted-foreground: #6B8A72;
            --foreground: #F0EDE4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Banner Header */
        .banner-container {
            width: 100%;
            height: 380px;
            position: relative;
            border-radius: 0 0 20px 20px;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 40px 60px 0 0;
        }

        .banner-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(11, 23, 16, 0.4), var(--background));
            z-index: 1;
        }

        .banner-content {
            position: relative;
            z-index: 2;
            color: var(--foreground);
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .banner-title {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1;
        }

        .banner-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.25rem;
            color: var(--muted-foreground);
        }

        .btn-back {
            align-self: flex-end;
            padding: 10px 20px;
            background-color: var(--primary);
            color: var(--foreground);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            border-radius: 6px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-back:hover {
            background-color: #328745;
            transform: translateY(-2px);
        }

        /* Success Card */
        .done-card {
            max-width: 520px;
            width: 90%;
            margin: -60px auto 60px auto;
            position: relative;
            z-index: 3;
            background: var(--card);
            border: 1px solid var(--secondary);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            color: var(--foreground);
            text-align: center;
            transition: all 0.3s ease;
        }

        .done-card:hover {
            border-color: var(--primary);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
            transform: translateY(-3px);
        }

        .done-card h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2.25rem;
            margin-bottom: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--foreground);
        }

        .done-card p {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: var(--muted-foreground);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: var(--foreground);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .btn-submit:hover {
            background-color: #328745;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <!-- Banner -->
    <div class="banner-container">
        <img src="{% static 'accounts/images/login_picture.png' %}" alt="Dina Arobi Hike Mauritius" class="banner-img">
        <div class="banner-overlay"></div>
        <div class="banner-content">
            <h1 class="banner-title">Account Update</h1>
            <p class="banner-subtitle">Update completed successfully</p>
            <a href="{% url 'accounts:account_detail' %}" class="btn-back">Back to My Account</a>
        </div>
    </div>

    <!-- Content Card -->
    <div class="done-card">
        <h2>Password Updated Successfully</h2>
        <p>Your password has been successfully updated. You can now use your new password on your next log in.</p>
        <a href="{% url 'accounts:account_detail' %}" class="btn-submit">Back to My Account</a>
    </div>

</body>
</html>
