{% extends "community/base.html" %}
{% block title %}Delete Review | Dina Arobi Hikes{% endblock %}
{% block content %}
<section class="da-page">
  <div class="da-container da-form-container">
    <div class="da-form-panel">
      <h2>Delete Review</h2>
      <p>Are you sure you want to delete this review?</p>
      <p class="da-muted">{{ review.text }}</p>
      <form method="post" class="da-form">
        {% csrf_token %}
        <div class="da-form-actions">
          <a href="{% url 'community:reviews' %}" class="da-text-link">Cancel</a>
          <button type="submit" class="da-button da-button-yellow da-button-compact">Delete Review</button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
